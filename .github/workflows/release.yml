name: Release

# 打 v 开头的 tag 时触发：先跑 ci.yml 那套测试，过了再构建安装包并发布 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试
    uses: ./.github/workflows/ci.yml

  windows:
    name: 构建 Windows 安装包
    needs: test
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建安装包
        # predist 钩子会先生成高亮 Worker、图标与第三方许可声明，再交给 electron-builder
        run: npm run dist

      - name: 生成校验和
        # 没有代码签名，SHA256SUMS.txt 是用户唯一能自己核对产物的手段
        run: node scripts/build-checksums.mjs

      - name: 列出产物
        run: Get-ChildItem -Recurse dist | Where-Object { !$_.PSIsContainer } | Select-Object Name, Length
        shell: pwsh

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # tag 里带连字符视为预发布（如 v0.0.1-alpha）
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # generate_release_notes 开启时，body 会放在自动生成的说明前面；
          # append_body 是布尔开关（追加到已有 Release 正文），不能拿来装这段文字
          body: |
            ### 校验下载

            本构建未配置代码签名，Windows SmartScreen 会提示「未知发布者」。下载后可以核对
            `SHA256SUMS.txt`：

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            安装目录的 `resources/` 下附带 `LICENSE`、`FEATURES.md`、`docs/` 与第三方
            许可声明 `notices/THIRD-PARTY-NOTICES.md`。
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
