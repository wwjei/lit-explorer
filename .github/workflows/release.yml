name: Release

# 打 v 开头的 tag 时触发：先跑 ci.yml 那套测试，过了再构建安装包并发布 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试
    uses: ./.github/workflows/ci.yml

  windows:
    name: 构建 Windows 安装包
    needs: test
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mygo/go.mod
          cache-dependency-path: mygo/go.sum

      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 构建安装包
        run: npm run dist

      - name: 安装与卸载验证
        shell: pwsh
        run: ./scripts/verify-installer.ps1

      - name: 生成校验和
        # 没有代码签名，SHA256SUMS.txt 是用户唯一能自己核对产物的手段
        run: node scripts/build-checksums.mjs

      - name: 列出产物
        run: Get-ChildItem -Recurse dist | Where-Object { !$_.PSIsContainer } | Select-Object Name, Length
        shell: pwsh

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # tag 里带连字符视为预发布（如 v0.0.1-alpha）
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # generate_release_notes 开启时，body 会放在自动生成的说明前面；
          # append_body 是布尔开关（追加到已有 Release 正文），不能拿来装这段文字
          body: |
            ### Lit Explorer · Windows x64

            | 文件 | 说明 |
            | --- | --- |
            | `Lit-Explorer-Setup-<版本>.exe` | 安装包，默认目录为 `%LOCALAPPDATA%\Programs\Lit Explorer` |
            | `Lit-Explorer-<版本>-portable.exe` | 免安装版 |

            需要 WebView2 Runtime（Windows 11 自带，Windows 10 通常随 Edge 提供）。
            旧版本项目设置和本机授权会在首次启动时迁移，已有新设置不会被覆盖。

            ### 校验下载

            本构建未配置代码签名，Windows SmartScreen 会提示「未知发布者」。下载后可以核对
            `SHA256SUMS.txt`：

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            许可与说明嵌入程序，可从应用菜单打开。
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
