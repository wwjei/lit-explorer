name: Release

# 打 v 开头的 tag 时触发：先跑 ci.yml 那套测试，过了再构建安装包并发布 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试
    uses: ./.github/workflows/ci.yml

  windows:
    name: 构建 Windows 安装包
    needs: test
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Electron 备用安装包
        # predist:electron 钩子会先生成高亮 Worker、图标与第三方许可声明，再交给 electron-builder
        # 注意：dist:electron 脚本会先清空 dist/，所以 MyGo 产物必须在它之后构建
        run: npm run dist:electron

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mygo/go.mod
          cache-dependency-path: mygo/go.sum

      - name: 构建 MyGo 默认安装包
        # 共用 src/renderer；MyGo CLI 在缺少 NSIS 时会自己下载
        run: node scripts/build-mygo.mjs

      - name: 生成校验和
        # 没有代码签名，SHA256SUMS.txt 是用户唯一能自己核对产物的手段
        run: node scripts/build-checksums.mjs

      - name: 列出产物
        run: Get-ChildItem -Recurse dist | Where-Object { !$_.PSIsContainer } | Select-Object Name, Length
        shell: pwsh

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # tag 里带连字符视为预发布（如 v0.0.1-alpha）
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # generate_release_notes 开启时，body 会放在自动生成的说明前面；
          # append_body 是布尔开关（追加到已有 Release 正文），不能拿来装这段文字
          body: |
            ### Windows 默认版：MyGo

            推荐下载下表前两个文件。MyGo 为默认版本；Electron 为兼容性备用版本。

            | 文件 | 说明 |
            | --- | --- |
            | `Lit-Explorer-Setup-<版本>.exe` | **默认 MyGo 安装包**，使用系统 WebView2 |
            | `Lit-Explorer-<版本>-portable.exe` | **默认 MyGo 免安装版** |
            | `Lit-Explorer-Electron-Backup-Setup-<版本>.exe` | Electron 备用安装包，自带 Chromium 运行时 |
            | `Lit-Explorer-Electron-Backup-<版本>-portable.exe` | Electron 备用免安装版 |

            MyGo 版需要 Windows 10/11 的 WebView2 Runtime（Windows 11 自带；Windows 10 一般
            随 Edge 提供）。两个版本可以并存：安装目录、卸载项与应用数据各自独立。

            ### 校验下载

            本构建未配置代码签名，Windows SmartScreen 会提示「未知发布者」。下载后可以核对
            `SHA256SUMS.txt`：

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            默认 MyGo 版将许可与说明嵌入程序，可从应用菜单打开；Electron 备用版在安装目录的
            `resources/` 下附带许可、功能说明和第三方许可声明。
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
