name: CI

# 开 PR 时跑；合并进 main 时再跑一次——main 上那个提交与 PR 头不是同一个
# （squash / merge commit 都是新提交），要验的正是合并后的结果。
#
# 不跟分支推送：往分支推一次又开 PR 会跑两遍，PR 那遍已经覆盖了同样的内容。
# 代价是「推了分支但还没开 PR」时不跑，这是接受的——分支上的提交本来就要开 PR 才会被 review。
#
# 在这之前只有打 tag 才会触发构建，测试从来没进过 CI —— 回归测试等于只在本地跑，
# 把测试跑挂的提交照样能打出 tag 发出去。
#
# workflow_call 是给 release.yml 复用的：发版前先过同一套测试，不重复写一遍。
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        # npm ci 同时校验 package.json 与 package-lock.json 是否同步，不一致直接失败。
        # 手工搬动依赖而忘了同步锁文件是这个项目出过三次的事故，别再绕过这一步。
        run: npm ci

      - name: 文档索引与链接
        # 新文档没进 AGENTS.md / CODEMAP.md，或者改名后留下死链，都在这里失败。
        # 只读 .md，不依赖构建产物。
        run: npm run check:docs

      - name: 构建渲染进程产物
        # 集成测试跑的是真实构建产物（src/renderer/vendor/），不先构建会测到空文件
        run: npm run build

      - name: 单元测试
        run: npm run test:unit

      - name: 集成测试
        run: npm run test:integration

      - name: 依赖漏洞扫描
        # 只看「会进安装包」的那部分：脚本拿 vendor/meta.json 把真正被打进产物的包与
        # 构建工具链分开，只有前者出现 high / critical 才返回非零。原始 npm audit 列表
        # 把两类混在一起，看了没法决定要不要紧张。
        run: npm run audit
