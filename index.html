<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目文件浏览器 · 原型</title>
<style>
/* ============ tokens ============ */
*{box-sizing:border-box}
:root{
  --bg:#f5f6f8;
  --panel:#ffffff;
  --panel-2:#fafbfc;
  --line:#e7e9ee;
  --line-soft:#f0f2f5;
  --line-strong:#d6dae2;
  --text:#1b1f26;
  --text-2:#5b6472;
  --muted:#98a0ad;
  --hover:#f2f4f7;
  --sel:#e9f0ff;
  --sel-line:#c6daff;
  --accent:#2f6fed;
  --accent-ink:#1b4fd0;
  --code-bg:#f7f8fa;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px rgba(16,24,40,.07);
  --radius:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0f1115;
  --panel:#161920;
  --panel-2:#1b1f27;
  --line:#262b35;
  --line-soft:#1f242d;
  --line-strong:#333a47;
  --text:#e7eaf0;
  --text-2:#a6aebd;
  --muted:#7d8697;
  --hover:#1e232c;
  --sel:#1c2a45;
  --sel-line:#2d4b7e;
  --accent:#6d93ff;
  --accent-ink:#adc4ff;
  --code-bg:#12151b;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:13px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 35%,transparent);border:3px solid transparent;background-clip:content-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 55%,transparent);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ shell ============ */
.app{height:100%;display:flex;flex-direction:column}
.topbar{
  flex:none;height:52px;display:flex;align-items:center;gap:14px;
  padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{
  width:26px;height:26px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,#3b7bf0,#7aa7ff);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 1px 3px rgba(47,111,237,.35);
}
.brand-name{font-size:13.5px;font-weight:500;letter-spacing:.01em}
.brand-sub{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.search{
  position:relative;display:flex;align-items:center;width:260px;max-width:34vw;
}
.search .ic{position:absolute;left:9px;color:var(--muted);pointer-events:none}
.search input{
  width:100%;height:30px;padding:0 10px 0 30px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel-2);
  font:inherit;font-size:12.5px;color:var(--text);outline:none;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--sel-line);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.iconbtn{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:var(--text-2);flex:none;
}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn.is-on{background:var(--sel);color:var(--accent-ink)}

.body{flex:1;display:flex;min-height:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}

/* breadcrumb */
.crumbs{
  flex:none;height:34px;display:flex;align-items:center;gap:2px;
  padding:0 10px;border-bottom:1px solid var(--line-soft);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  scrollbar-width:none;
}
.crumbs::-webkit-scrollbar{display:none}
.crumb{
  padding:3px 7px;border-radius:6px;color:var(--muted);font-size:12px;
  flex:none;
}
.crumb:hover{background:var(--hover);color:var(--text)}
.crumb.is-last{color:var(--text);font-weight:500}
.crumb-sep{color:var(--line-strong);flex:none;display:grid;place-items:center;font-size:11px}

/* columns */
.cols{flex:1;display:flex;min-height:0;overflow-x:auto;overflow-y:hidden}
.col{
  width:246px;flex:none;min-height:0;display:flex;flex-direction:column;
  border-right:1px solid var(--line);background:var(--panel);
  animation:colIn .16s ease both;
}
@keyframes colIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.col-head{
  flex:none;height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 12px;border-bottom:1px solid var(--line-soft);
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
}
.col-head b{font-weight:500}
.col-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:5px 6px 12px}
.col-empty{padding:14px 10px;color:var(--muted);font-size:12px}

.row{
  display:flex;align-items:center;gap:8px;height:28px;padding:0 7px;
  border-radius:7px;position:relative;
}
.row .nm{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12.5px;
}
.row .meta{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .chev{flex:none;color:var(--muted);opacity:0;margin-right:-2px}
.row:hover{background:var(--hover)}
.row:hover .chev{opacity:1}
.row.is-trail{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.row.is-trail .nm{color:var(--text-2)}
.row.is-sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--sel-line)}
.row.is-sel .nm{font-weight:500;color:var(--accent-ink)}
.row.is-sel .chev{opacity:1;color:var(--accent-ink)}
.row.is-sel .meta{color:color-mix(in srgb,var(--accent-ink) 60%,var(--muted))}
.ic{flex:none;display:block}
.c-folder{color:#e3a63c}.c-md{color:#3b82f6}.c-html{color:#e2603a}
.c-js{color:#cfa01a}.c-json{color:#3f9a6d}.c-css{color:#8b5cf6}
.c-img{color:#e0568a}.c-txt{color:#8b93a1}.c-bin{color:#8b93a1}
[data-theme="dark"] .c-folder{color:#e8b155}[data-theme="dark"] .c-js{color:#e0b93f}

/* gutter + preview */
.gutter{flex:none;width:5px;background:transparent;position:relative}
.gutter::after{
  content:"";position:absolute;inset:0 1px;border-radius:2px;background:transparent;
}
.gutter:hover::after{background:var(--sel-line)}
body.resizing{cursor:col-resize}
body.resizing .gutter::after{background:var(--accent)}

.preview{
  flex:none;width:46%;min-width:320px;display:flex;flex-direction:column;
  background:var(--panel);border-left:1px solid var(--line);min-height:0;
}
.pv-head{
  flex:none;display:flex;align-items:flex-start;gap:10px;
  padding:12px 12px 10px 14px;border-bottom:1px solid var(--line-soft);
}
.pv-head:empty{display:none}
.pv-ic{margin-top:2px}
.pv-name{flex:1;min-width:0}
.pv-nm{
  font-size:13.5px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pv-sub{
  margin-top:3px;font-size:11.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pv-actions{flex:none;display:flex;align-items:center;gap:4px}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{
  padding:2px 9px;border-radius:6px;font-size:11.5px;color:var(--text-2);
}
.seg button.is-on{background:var(--panel);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.pv-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pv-body.is-empty{align-items:center;justify-content:center;padding:24px}

/* empty / unsupported states */
.state{text-align:center;color:var(--muted);max-width:340px}
.state .big{
  width:56px;height:56px;margin:0 auto 14px;border-radius:16px;
  display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);
  color:var(--line-strong);
}
.state h4{margin:0 0 6px;font-size:13.5px;font-weight:500;color:var(--text-2)}
.state p{margin:0;font-size:12.5px;line-height:1.7}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:18px}
.keys span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
kbd{
  font:inherit;font-size:11px;min-width:20px;height:20px;padding:0 5px;
  display:inline-grid;place-items:center;border-radius:5px;
  background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;
  color:var(--text-2);
}

/* mini browser */
.browser{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel-2)}
.browser-bar{
  flex:none;height:38px;display:flex;align-items:center;gap:10px;
  padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel);
}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;display:block}
.dots .r{background:#ff5f57}.dots .y{background:#febc2e}.dots .g{background:#28c840}
[data-theme="dark"] .dots i{opacity:.75}
.addr{
  flex:1;min-width:0;height:24px;display:flex;align-items:center;gap:6px;
  padding:0 10px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);
  color:var(--muted);font-size:11.5px;font-family:var(--mono);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.frame{flex:1;min-height:0;width:100%;border:0;background:#fff;display:block}

/* code view */
.codeview{
  flex:1;min-height:0;overflow:auto;background:var(--panel);
  font-family:var(--mono);font-size:12.5px;line-height:1.65;
  padding:12px 0 24px;
}
.cl{display:flex;padding:0 14px}
.cl:hover{background:var(--panel-2)}
.cl .ln{
  flex:none;width:38px;text-align:right;padding-right:14px;
  color:var(--line-strong);user-select:none;font-size:11.5px;line-height:1.8;
}
.cl .lc{white-space:pre;flex:1;min-width:0}
.tk-cm{color:#8b93a1;font-style:italic}
.tk-st{color:#2f9e6e}
.tk-nu{color:#c2643a}
.tk-kw{color:#8b5cf6}
.tk-co{color:#c2643a}
.tk-ty{color:#2f6fed}
.tk-ky{color:#2f6fed}
.tk-pr{color:#2f6fed}
.tk-va{color:#c2643a}
[data-theme="dark"] .tk-cm{color:#6b7484}
[data-theme="dark"] .tk-st{color:#63c99b}
[data-theme="dark"] .tk-nu{color:#e59a6c}
[data-theme="dark"] .tk-kw{color:#b79cff}
[data-theme="dark"] .tk-ty{color:#82a8ff}
[data-theme="dark"] .tk-ky{color:#82a8ff}
[data-theme="dark"] .tk-pr{color:#82a8ff}
[data-theme="dark"] .tk-va{color:#e59a6d}

/* image view */
.img-wrap{
  flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:28px;
  background:
    linear-gradient(45deg,var(--panel-2) 25%,transparent 25%,transparent 75%,var(--panel-2) 75%),
    linear-gradient(45deg,var(--panel-2) 25%,transparent 25%,transparent 75%,var(--panel-2) 75%);
  background-size:18px 18px;background-position:0 0,9px 9px;background-color:var(--panel);
}
.img-wrap img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:var(--shadow);background:#fff}

/* markdown prose */
.prose-wrap{flex:1;min-height:0;overflow:auto}
.prose{
  max-width:700px;margin:0 auto;padding:26px 30px 64px;
  font-size:13.5px;line-height:1.78;color:var(--text);
}
.prose>*:first-child{margin-top:0}
.prose h1,.prose h2,.prose h3,.prose h4{line-height:1.4;margin:26px 0 10px;font-weight:500}
.prose h1{font-size:22px;letter-spacing:-.01em}
.prose h2{font-size:16.5px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.prose h3{font-size:14.5px}
.prose h4{font-size:13.5px;color:var(--text-2)}
.prose p{margin:11px 0}
.prose ul,.prose ol{margin:11px 0;padding-left:22px}
.prose li{margin:4px 0}
.prose li::marker{color:var(--muted)}
.prose code{
  font-family:var(--mono);font-size:12px;background:var(--code-bg);
  border:1px solid var(--line-soft);padding:1.5px 5px;border-radius:5px;
}
.prose pre{
  margin:14px 0;padding:13px 15px;border-radius:10px;overflow:auto;
  background:var(--code-bg);border:1px solid var(--line);
  font-family:var(--mono);font-size:12.5px;line-height:1.72;
}
.prose pre code{background:none;border:0;padding:0;font-size:inherit;white-space:pre}
.prose blockquote{
  margin:14px 0;padding:2px 0 2px 14px;border-left:3px solid var(--line-strong);
  color:var(--text-2);
}
.prose blockquote p{margin:4px 0}
.prose a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.prose a:hover{border-bottom-color:var(--accent)}
.prose hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.prose table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.5px}
.prose th,.prose td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--panel-2);font-weight:500;color:var(--text-2)}
.prose tbody tr:hover{background:var(--panel-2)}
.prose del{color:var(--muted)}
.md-table-wrap{overflow-x:auto}

/* folder summary in preview */
.folder-card{flex:1;min-height:0;overflow:auto;padding:26px 24px}
.folder-hero{display:flex;align-items:center;gap:14px;padding-bottom:20px;border-bottom:1px solid var(--line-soft)}
.folder-hero .big{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line)}
.folder-hero h3{margin:0;font-size:15px;font-weight:500}
.folder-hero p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.folder-list{margin-top:14px;display:flex;flex-direction:column;gap:1px}
.frow{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;text-align:left}
.frow:hover{background:var(--hover)}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.frow .meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* status bar */
.status{
  flex:none;height:28px;display:flex;align-items:center;gap:16px;
  padding:0 14px;border-top:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:11.5px;
}
.status .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.status .hints{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.status .hints span{display:flex;align-items:center;gap:4px}
.status kbd{height:17px;min-width:17px;font-size:10px;border-bottom-width:1px}

/* toast */
#toast{
  position:fixed;left:50%;bottom:44px;transform:translate(-50%,10px);
  padding:9px 16px;border-radius:10px;background:#1b1f26;color:#fff;
  font-size:12.5px;box-shadow:0 8px 30px rgba(16,24,40,.28);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.spin{animation:spin .5s ease}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .col{animation:none}
  #toast{transition:none}
}
@media (max-width:900px){
  .search{width:170px}
  .preview{min-width:280px}
  .status .hints{display:none}
}
</style>
</head>

<script type="text/plain" id="f-readme">
# Demo Project

一个用于演示 **文件浏览器** 交互的前端原型：多栏目录导航 + 内嵌预览。

## 核心特性

- Miller Columns 多栏导航，点击文件夹自动展开下一栏
- `HTML` 在右侧迷你浏览器中渲染，可刷新
- `Markdown` 实时渲染，支持「预览 / 源码」切换
- 双击文件调用系统默认程序打开

## 快速开始

```bash
npm install
npm run dev
```

## 目录结构

| 路径 | 说明 |
| --- | --- |
| `src/` | 应用源码 |
| `docs/` | 设计与接口文档 |
| `assets/` | 静态资源 |
| `tests/` | 单元与端到端测试 |

## 交互约定

> 单击 = 选中并预览，双击 = 等同资源管理器的「打开」。

更多细节见 [架构说明](docs/architecture.md) 与 [接口参考](docs/api-reference.md)。

<style>
  :root{--ink:#12161d;--muted:#6b7482;--accent:#2f6fed}
  *{box-sizing:border-box}

<script type="text/plain" id="f-arch">
# 架构说明

## 分层

1. **数据层** —— 目录树通过 `scan` 接口按需懒加载，只读取当前层的子节点。
2. **视图层** —— 每一栏对应路径中的一级目录，选中项决定下一栏的内容。
3. **预览层** —— 按文件类型分派到不同渲染器，渲染器之间互不感知。

## 渲染器分派

| 类型 | 渲染器 | 说明 |
| --- | --- | --- |
| `.html` `.htm` | 沙箱 iframe | 禁止同源，隔离脚本 |
| `.md` | Markdown → HTML | 支持源码切换 |
| `.js` `.css` `.json` | 代码高亮 | 只读展示 |
| `.svg` `.png` `.jpg` | 图片查看器 | 自适应缩放 |

```js
const renderer = {
  html: renderIframe,
  md: renderMarkdown,
  code: renderCode,
};

export function preview(node, container) {
  const render = renderer[node.kind] ?? renderFallback;
  return render(node, container);
}
```

## 性能约定

> 目录层级超过 5 层时只保留最近 3 栏的 DOM，其余栏位复用缓存。

- 单栏条目超过 200 个时启用虚拟滚动
- 预览渲染在主线程空闲时预取（`requestIdleCallback`）
</script>

<script type="text/plain" id="f-api">
# 接口参考

## `GET /api/tree`

返回指定目录下的条目列表。

**查询参数**

- `path` —— 目录相对路径，默认 `"."`
- `depth` —— 递归深度，默认 `1`

**响应示例**

```json
{
  "path": "src",
  "entries": [
    { "name": "main.js", "type": "file", "size": 2048, "mtime": 1758621600 },
    { "name": "components", "type": "dir", "children": [] }
  ]
}
```

## `GET /api/file`

读取单个文件内容。文本文件返回 `utf-8` 字符串，二进制文件返回 `base64` 与 `mime`。

| 字段 | 类型 | 说明 |
| --- | --- | --- |
| `path` | string | 文件相对路径 |
| `encoding` | string | `utf-8` \| `base64` |
| `mime` | string | 用于预览分派 |

## 错误码

- `404` 路径不存在
- `403` 超出允许访问的根目录
- `413` 文件过大（默认上限 5 MB）

<script type="text/plain" id="f-modal-jsx">
import { useEffect, useRef } from 'react';

export function Modal({ open, title, onClose, children }) {
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return undefined;

    const onKey = (e) => {
      if (e.key === 'Escape') onClose();
    };

    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  if (!open) return null;

  return (
    <div className="modal-mask" onClick={onClose}>
      <div className="modal" ref={ref} onClick={(e) => e.stopPropagation()}>
        <header>{title}</header>
        <section>{children}</section>
      </div>
    </div>
  );
}
</script>

<script type="text/plain" id="f-format-js">
const UNITS = ['B', 'KB', 'MB', 'GB'];

export function formatSize(bytes) {
  let n = Number(bytes) || 0;
  let i = 0;

  while (n >= 1024 && i < UNITS.length - 1) {
    n /= 1024;
    i += 1;
  }

  return `${n.toFixed(i === 0 ? 0 : 1)} ${UNITS[i]}`;
}

export function formatTime(input) {
  const d = new Date(input);
  const pad = (v) => String(v).padStart(2, '0');

  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
    `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
</script>

<script type="text/plain" id="f-request-js">
const BASE = '/api';

export async function request(path, options = {}) {
  const res = await fetch(`${BASE}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });

  if (!res.ok) {
    throw new Error(`${res.status} ${res.statusText}`);
  }

  return res.json();
}

export const getTree = (path = '.') => request(`/tree?path=${encodeURIComponent(path)}`);
export const getFile = (path) => request(`/file?path=${encodeURIComponent(path)}`);
</script>

    if (!node) return 'none';
    if (node.type === 'folder') return 'folder';
    if (node.kind === 'html') return 'html';
    if (node.kind === 'md') return 'md';
    if (node.kind === 'svg' || node.kind === 'image') return 'image';
    if (['js', 'jsx', 'json', 'css', 'txt'].indexOf(node.kind) >= 0) return 'code';
    return 'none';
  }
  const hasSource = (node) => ['html', 'md', 'image'].indexOf(kindOf(node)) >= 0;

  /* ================= 语法高亮 ================= */
  const TOKENS = {
    js: [
      [/\/\/.*|\/\*.*?\*\//, 'cm'],
      [/"(?:\\.|[^"\\])*"/, 'st'], [/'(?:\\.|[^'\\])*'/, 'st'], [/`(?:\\.|[^`\\])*`/, 'st'],
      [/\b\d[\w.]*\b/, 'nu'],
      [/\b(?:const|let|var|function|return|if|else|for|while|of|in|new|class|extends|import|export|default|async|await|try|catch|finally|throw|typeof|instanceof|delete|void|yield|static|this|super)\b/, 'kw'],
      [/\b(?:true|false|null|undefined)\b/, 'co'],
      [/\b[A-Z][\w$]*/, 'ty']
    ],
    json: [
      [/"(?:\\.|[^"\\])*"(?=\s*:)/, 'ky'],
      [/"(?:\\.|[^"\\])*"/, 'st'],
      [/-?\b\d[\w.]*\b/, 'nu'],
      [/\b(?:true|false|null)\b/, 'kw']
    ],
    css: [
      [/\/\*.*?\*\//, 'cm'],
      [/"(?:\\.|[^"\\])*"/, 'st'], [/'(?:\\.|[^'\\])*'/, 'st'],
      [/[a-zA-Z-]+(?=\s*:)/, 'pr'],
      [/#[0-9a-fA-F]{3,8}\b/, 'nu'],
      [/-?\d[\w.%]*/, 'va'],
      [/--?[a-zA-Z][\w-]*/, 'va']
    ],
    html: [
      [/<!--.*?-->/, 'cm'],
      [/"(?:[^"\\])*"/, 'st'], [/'(?:[^'\\])*'/, 'st'],
      [/<\/?[a-zA-Z][\w-]*/, 'ty'],
      [/[\w-]+(?=\s*=)/, 'pr'],
      [/<!doctype[^>]*>/i, 'kw']
    ]
  };
  const LANG_ALIAS = { jsx: 'js', ts: 'js', tsx: 'js', htm: 'html', svg: 'html', sh: null, bash: null };
  const RE_CACHE = {};
  function hl(line, lang) {
    if (lang && Object.prototype.hasOwnProperty.call(LANG_ALIAS, lang)) lang = LANG_ALIAS[lang];
    const pairs = TOKENS[lang];
    if (!pairs) return esc(line);
    if (!RE_CACHE[lang]) {
      RE_CACHE[lang] = new RegExp(pairs.map((p) => '(' + p[0].source + ')').join('|'), 'g');
    }
    const re = RE_CACHE[lang];
    re.lastIndex = 0;
    let out = '', last = 0, m;
    while ((m = re.exec(line)) !== null) {
      if (m[0] === '') { re.lastIndex++; continue; }
      out += esc(line.slice(last, m.index));
      let gi = 0;
      for (let i = 1; i < m.length; i++) { if (m[i] !== undefined) { gi = i - 1; break; } }
      out += '<span class="tk-' + pairs[gi][1] + '">' + esc(m[0]) + '</span>';
      last = m.index + m[0].length;
    }
    out += esc(line.slice(last));
    return out;
  }
  const hlBlock = (src, lang) => src.split('\n').map((l) => hl(l, lang)).join('\n');

  function codeView(src, lang) {
    const lines = String(src).replace(/\t/g, '  ').split('\n');
    return '<div class="codeview">' + lines.map((l, i) =>
      '<div class="cl"><span class="ln">' + (i + 1) + '</span><span class="lc">'
      + (hl(l, lang) || '&nbsp;') + '</span></div>'
    ).join('') + '</div>';
  }

  /* ================= Markdown ================= */
  function inlineMd(s) {
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = esc(s);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + esc(codes[+i]) + '</code>');
    return s;
  }

  function renderList(items, start, base) {
    const level = base === undefined ? items[start].indent : base;
    const tag = items[start].ordered ? 'ol' : 'ul';
    let html = '<' + tag + '>';
    let i = start;
    while (i < items.length) {
      const it = items[i];
      if (it.indent < level) break;
      if (it.indent > level) {
        const nested = renderList(items, i, it.indent);
        html += nested.html;
        i = nested.next;
        continue;
      }
      html += '<li>' + inlineMd(it.text);
      if (i + 1 < items.length && items[i + 1].indent > level) {
        const nested = renderList(items, i + 1, items[i + 1].indent);
        html += nested.html;
        i = nested.next;
      }
      html += '</li>';
      i++;
    }
    return { html: html + '</' + tag + '>', next: i };
  }

  function mdToHtml(src) {
    const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let para = [];
    let i = 0;
    const flush = () => { if (para.length) { out.push('<p>' + inlineMd(para.join(' ')) + '</p>'); para = []; } };

    while (i < lines.length) {
      const line = lines[i];

      if (!line.trim()) { flush(); i++; continue; }

      let m = line.match(/^\s*```(\w*)\s*$/);
      if (m) {
        flush();
        const lang = m[1] || null;
        const buf = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code>' + hlBlock(buf.join('\n'), lang) + '</code></pre>');
        continue;
      }

      m = line.match(/^(#{1,6})\s+(.*)$/);
      if (m) {
        flush();
        const n = m[1].length;
        out.push('<h' + n + '>' + inlineMd(m[2].replace(/\s+#+\s*$/, '')) + '</h' + n + '>');
        i++;
        continue;
      }

      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flush(); out.push('<hr>'); i++; continue; }

      if (/^\s*>/.test(line)) {
        flush();
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          buf.push(lines[i].replace(/^\s*>\s?/, ''));
          i++;
        }
        out.push('<blockquote>' + mdToHtml(buf.join('\n')) + '</blockquote>');
        continue;
      }

      const next = lines[i + 1];
      if (line.indexOf('|') >= 0 && next && /-/.test(next) && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(next)) {
        flush();
        const cells = (s) => s.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const head = cells(line);
        const align = cells(next).map((a) => (/^:-+:$/.test(a) ? 'center' : /-+:$/.test(a) ? 'right' : 'left'));
        const attr = (k) => align[k] && align[k] !== 'left' ? ' style="text-align:' + align[k] + '"' : '';
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') >= 0) { rows.push(cells(lines[i])); i++; }
        out.push('<div class="md-table-wrap"><table><thead><tr>'
          + head.map((c, k) => '<th' + attr(k) + '>' + inlineMd(c) + '</th>').join('')
          + '</tr></thead><tbody>'
          + rows.map((r) => '<tr>' + head.map((_, k) => '<td' + attr(k) + '>' + inlineMd(r[k] || '') + '</td>').join('') + '</tr>').join('')
          + '</tbody></table></div>');
        continue;
      }

      if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
        flush();
        const items = [];
        while (i < lines.length) {
          const lm = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
          if (!lm) {
            if (!lines[i].trim() && i + 1 < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i + 1])) { i++; continue; }
            break;
          }
          items.push({ indent: lm[1].replace(/\t/g, '  ').length, ordered: /\d/.test(lm[2]), text: lm[3] });
          i++;
        }
        out.push(renderList(items, 0).html);
        continue;
      }

      para.push(line.trim());
      i++;
    }
    flush();
    return out.join('\n');
  }

  /* ================= 渲染：列 ================= */
  const colsEl = $('#cols');
  const crumbsEl = $('#crumbs');
  const pvHead = $('#pv-head');
  const pvBody = $('#pv-body');

  const byName = (a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true });
  function sorted(items) {
    return items.slice().sort((a, b) => {
      if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
      return byName(a, b);
    });
  }
  function matchQuery(node) {
    if (!state.query) return true;
    return node.name.toLowerCase().indexOf(state.query.toLowerCase()) >= 0;
  }
  const metaText = (node) => node.type === 'folder'
    ? node.children.length + ' 项'
    : (node.size || '');

  function buildColumn(ci) {
    const folder = state.path[ci];
    const col = document.createElement('div');
    col.className = 'col';

    const items = sorted(folder.children || []).filter(matchQuery);
    colItems[ci] = items;

    const head = document.createElement('div');
    head.className = 'col-head';
    head.innerHTML = '<b>' + esc(folder.name) + '</b><span>'
      + (state.query && items.length !== folder.children.length
        ? items.length + ' / ' + folder.children.length
        : items.length) + '</span>';
    col.appendChild(head);

    const list = document.createElement('div');
    list.className = 'col-list';

    if (!items.length) {
      list.innerHTML = '<div class="col-empty">' + (state.query ? '无匹配项' : '空目录') + '</div>';
    } else {
      items.forEach((node, idx) => {
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.col = ci;
        row.dataset.idx = idx;
        row.setAttribute('role', 'button');
        row.title = node.name;
        row.innerHTML = nodeIcon(node)
          + '<span class="nm">' + esc(node.name) + '</span>'
          + '<span class="meta">' + esc(metaText(node)) + '</span>'
          + (node.type === 'folder' ? '<span class="chev">' + icon('chevron', '', 14) + '</span>' : '');
        list.appendChild(row);
      });
    }

    col.appendChild(list);
    colsEl.appendChild(col);
  }

  function renderColumns() {
    // 逐栏比对内容签名，只重建真正变化的那一栏及其右侧各栏。
    // 整片重建会让所有列入场动画重放（看起来就是整个列表在闪），
    // 也会让双击的第二次点击落到新节点上，浏览器便不再合成 dblclick。
    const keys = state.path.map((folder) => folder.name + '\u0001' + state.query);

    let firstStale = 0;
    while (firstStale < keys.length
      && firstStale < renderedColKeys.length
      && keys[firstStale] === renderedColKeys[firstStale]) {
      firstStale++;
    }

    while (colsEl.children.length > firstStale) colsEl.lastElementChild.remove();
    for (let ci = firstStale; ci < state.path.length; ci++) buildColumn(ci);

    colItems.length = state.path.length;
    renderedColKeys = keys;
    updateRowStates();

    if (state.pendingScroll) {
      state.pendingScroll = false;
      requestAnimationFrame(() => {
        colsEl.scrollTo({ left: colsEl.scrollWidth, behavior: 'smooth' });
      });
    }
  }

  function renderCrumbs() {
    const parts = state.path.map((n) => n.name);
    const sel = state.sel;
    if (sel && sel.node.type === 'file') parts.push(sel.node.name);

    let html = '<button class="crumb" data-crumb="-1" title="项目根目录">' + icon('home', '', 14) + '</button>';
    parts.forEach((p, i) => {
      html += '<span class="crumb-sep">' + icon('chevron', '', 13) + '</span>';
      const last = i === parts.length - 1;
      html += '<button class="crumb' + (last ? ' is-last' : '') + '" data-crumb="' + i + '">' + esc(p) + '</button>';
    });
    crumbsEl.innerHTML = html;
  }

  /* ================= 渲染：预览 ================= */
  function emptyState() {
    return '<div class="state">'
      + '<div class="big">' + icon('folder', '', 26) + '</div>'
      + '<h4>未选择文件</h4>'
      + '<p>在左侧栏中选择一个文件即可在此预览，双击则调用系统默认程序打开。</p>'
      + '<div class="keys">'
      + '<span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>'
      + '<span><kbd>→</kbd> 进入目录</span>'
      + '<span><kbd>←</kbd> 返回上级</span>'
      + '<span><kbd>⏎</kbd> 打开</span>'
      + '</div></div>';
  }

  function folderCard(node) {
    const items = sorted(node.children || []);
    const rows = items.map((c) => '<button class="frow" data-open="' + escAttr(c.name) + '">'
      + nodeIcon(c, 15)
      + '<span class="nm">' + esc(c.name) + '</span>'
      + '<span class="meta">' + esc(metaText(c)) + '</span></button>').join('');
    return '<div class="folder-card">'
      + '<div class="folder-hero">'
      + '<span class="big">' + icon('folder', 'c-folder', 24) + '</span>'
      + '<div><h3>' + esc(node.name) + '</h3><p>' + items.length + ' 个项目'
      + (node.mtime ? ' · 修改于 ' + esc(node.mtime) : '') + '</p></div>'
      + '</div>'
      + '<div class="folder-list">' + rows + '</div>'
      + '</div>';
  }

  function unsupported(node) {
    return '<div class="state">'
      + '<div class="big">' + icon('box', '', 24) + '</div>'
      + '<h4>' + esc(node.name) + '</h4>'
      + '<p>该类型暂不支持内嵌预览（' + esc(node.size || '') + '）。</p>'
      + '<p style="margin-top:14px"><button class="iconbtn" data-act="external" style="width:auto;padding:0 14px;height:32px;gap:7px;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel)">'
      + icon('external', '', 15) + '<span style="font-size:12.5px">用默认程序打开</span></button></p>'
      + '</div>';
  }

  function renderPreview(force) {
    const pv = $('#preview');
    $('#gutter').hidden = !state.previewOpen;
    if (!state.previewOpen) { pv.hidden = true; renderedPreviewKey = ''; return; }
    pv.hidden = false;

    // 预览签名不变就不重绘：重复点击同一个文件时不该重载 iframe / 重排正文。
    const sel = state.sel;
    const sig = sel
      ? [state.path.map((n) => n.name).join('/'), sel.node.name, state.mode].join('\u0001')
      : '';
    if (!force && sig === renderedPreviewKey && pvBody.children.length) return;
    renderedPreviewKey = sig;

    if (!sel) {
      pvHead.innerHTML = '';
      pvBody.className = 'pv-body is-empty';
      pvBody.innerHTML = emptyState();
      return;
    }

    const node = sel.node;
    const dirs = state.path.map((n) => n.name);
    const full = node.type === 'folder' ? dirs.join(' / ') : dirs.concat([node.name]).join(' / ');
    const kind = kindOf(node);
    const sub = [full];
    if (node.size) sub.push(node.size);
    if (node.mtime) sub.push(node.mtime);

    const seg = hasSource(node)
      ? '<div class="seg" role="tablist">'
        + '<button data-mode="preview" class="' + (state.mode === 'preview' ? 'is-on' : '') + '">预览</button>'
        + '<button data-mode="source" class="' + (state.mode === 'source' ? 'is-on' : '') + '">源码</button>'
        + '</div>'
      : '';

    pvHead.innerHTML = '<span class="pv-ic">' + nodeIcon(node, 17) + '</span>'
      + '<div class="pv-name"><div class="pv-nm" title="' + escAttr(node.name) + '">' + esc(node.name) + '</div>'
      + '<div class="pv-sub" title="' + escAttr(sub.join(' · ')) + '">' + esc(sub.join(' · ')) + '</div></div>'
      + '<div class="pv-actions">' + seg
      + '<button class="iconbtn" data-act="reload" title="重新渲染">' + icon('refresh', '', 15) + '</button>'
      + '<button class="iconbtn" data-act="copy" title="复制路径">' + icon('copy', '', 15) + '</button>'
      + '<button class="iconbtn" data-act="external" title="用默认程序打开">' + icon('external', '', 15) + '</button>'
      + '<button class="iconbtn" data-act="close" title="收起预览">' + icon('close', '', 15) + '</button>'
      + '</div>';

    pvBody.className = 'pv-body';
    const src = content(node);
    const showSource = state.mode === 'source' && hasSource(node);

    if (kind === 'folder') {
      pvBody.innerHTML = folderCard(node);
      return;
    }
    if (kind === 'none') {
      pvBody.innerHTML = unsupported(node);
      return;
    }
    if (showSource) {
      pvBody.innerHTML = codeView(src, node.kind === 'md' ? null : node.kind);
      return;
    }
    if (kind === 'html') {
      pvBody.innerHTML = '<div class="browser">'
        + '<div class="browser-bar">'
        + '<span class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></span>'
        + '<div class="addr">' + icon('lock', '', 12) + '<span>file:///demo-project/' + esc(full.split(' / ').slice(1).join('/')) + '</span></div>'
        + '<button class="iconbtn" data-act="reload" title="刷新">' + icon('refresh', '', 15) + '</button>'
        + '</div>'
        + '<iframe class="frame" title="' + escAttr(node.name) + ' 预览" sandbox="allow-scripts allow-forms allow-popups" srcdoc="' + escAttr(src) + '"></iframe>'
        + '</div>';
      return;
    }
    if (kind === 'md') {
      pvBody.innerHTML = '<div class="prose-wrap"><article class="prose">' + mdToHtml(src) + '</article></div>';
      return;
    }
    if (kind === 'image') {
      const url = node.kind === 'svg' || /^\s*<svg/.test(src)
        ? 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src)
        : src;
      pvBody.innerHTML = '<div class="img-wrap"><img src="' + escAttr(url) + '" alt="' + escAttr(node.name) + '"></div>';
      return;
    }
    pvBody.innerHTML = codeView(src, node.kind);
  }

  function renderStatus() {
    const sel = state.sel;
    const dirs = state.path.map((n) => n.name);
    const p = sel && sel.node.type === 'file' ? dirs.concat([sel.node.name]) : dirs;
    $('#st-path').textContent = p.join(' / ') + (sel && sel.node.type === 'folder' ? '  ·  ' + sel.node.children.length + ' 个项目' : '');
  }

  function render() {
    renderColumns();
    renderCrumbs();
    renderPreview();
    renderStatus();
  }

  /* ================= 交互 ================= */
  function selectNode(node, col, scroll) {
    state.sel = { col: col, node: node };
    state.mode = 'preview';
    if (node.type === 'folder') {
      state.path = state.path.slice(0, col + 1).concat([node]);
      state.pendingScroll = scroll !== false;
    } else {
      state.path = state.path.slice(0, col + 1);
      state.pendingScroll = false;
    }
    render();
  }

  function openWithSystem(node) {
    const kind = kindOf(node);
    const src = content(node);
    const name = node.name;
    toast('已用系统默认程序打开：' + name);
    if (!src || kind === 'folder' || kind === 'none') return;
    const type = kind === 'html' ? 'text/html'
      : kind === 'md' ? 'text/markdown'
        : kind === 'image' ? 'image/svg+xml' : 'text/plain';
    const url = URL.createObjectURL(new Blob([src], { type: type + ';charset=utf-8' }));
    // 真实实现里这一步是 shell.open(path)：交给系统默认程序
    const win = window.open(url, '_blank');
    if (!win) toast('已用系统默认程序打开：' + name + ' · 新标签页被当前环境拦截');
  }

  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
  }

  function copyPath(node) {
    const dirs = state.path.map((n) => n.name);
    const full = node.type === 'folder' ? dirs.join('/') : dirs.concat([node.name]).join('/');
    const done = () => toast('已复制路径：' + full);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(done, done);
    } else {
      done();
    }
  }

  colsEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    const node = colItems[+row.dataset.col][+row.dataset.idx];
    selectNode(node, +row.dataset.col);
  });

  colsEl.addEventListener('dblclick', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    const node = colItems[+row.dataset.col][+row.dataset.idx];
    if (node.type === 'file') openWithSystem(node);
  });

  crumbsEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-crumb]');
    if (!b) return;
    const i = +b.dataset.crumb;
    if (i < 0) {
      state.path = [TREE];
      state.sel = null;
    } else {
      state.path = state.path.slice(0, i + 1);
      state.sel = i === 0 ? null : { col: i - 1, node: state.path[i] };
    }
    render();
  });

  pvHead.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn || !state.sel) return;
    const node = state.sel.node;
    if (btn.dataset.mode) {
      state.mode = btn.dataset.mode;
      renderPreview();
      return;
    }
    const act = btn.dataset.act;
    if (act === 'reload') {
      btn.classList.add('spin');
      setTimeout(() => btn.classList.remove('spin'), 520);
      renderPreview(true);
    } else if (act === 'copy') {
      copyPath(node);
    } else if (act === 'external') {
      openWithSystem(node);
    } else if (act === 'close') {
      state.previewOpen = false;
      $('#btn-preview').classList.remove('is-on');
      renderPreview();
    }
  });

  pvBody.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (btn && state.sel) {
      if (btn.dataset.act === 'reload') {
        btn.classList.add('spin');
        setTimeout(() => btn.classList.remove('spin'), 520);
        renderPreview(true);
      } else if (btn.dataset.act === 'external') {
        openWithSystem(state.sel.node);
      }
      return;
    }
    const open = e.target.closest('[data-open]');
    if (open && state.sel && state.sel.node.type === 'folder') {
      const child = state.sel.node.children.filter((c) => c.name === open.dataset.open)[0];
      if (child) selectNode(child, state.sel.col + 1);
    }
  });

  $('#btn-preview').addEventListener('click', (e) => {
    state.previewOpen = !state.previewOpen;
    e.currentTarget.classList.toggle('is-on', !state.previewOpen);
    renderPreview();
  });

  $('#btn-theme').addEventListener('click', () => {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = state.theme;
    $('#theme-ic').innerHTML = state.theme === 'light' ? ICONS.moon : ICONS.sun;
  });

  $('#search').addEventListener('input', (e) => {
    state.query = e.target.value.trim();
    render();
  });

  /* 键盘 */
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') {
      if (e.key === 'Escape') {
        e.target.value = '';
        state.query = '';
        e.target.blur();
        render();
      }
      return;
    }
    if (e.key === '/') { e.preventDefault(); $('#search').focus(); return; }

    const sel = state.sel;
    const col = sel ? sel.col : 0;
    const items = colItems[col] || [];

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!items.length) return;
      e.preventDefault();
      let idx = sel ? items.indexOf(sel.node) : -1;
      idx = e.key === 'ArrowDown'
        ? Math.min(items.length - 1, idx + 1)
        : Math.max(0, idx - 1);
      if (idx < 0) idx = 0;
      selectNode(items[idx], col, false);
      const row = colsEl.querySelector('.row.is-sel');
      if (row) row.scrollIntoView({ block: 'nearest' });
      return;
    }

    if (e.key === 'ArrowRight') {
      if (sel && sel.node.type === 'folder' && sel.node.children.length) {
        e.preventDefault();
        selectNode(sel.node.children[0], col + 1);
      }
      return;
    }

    if (e.key === 'ArrowLeft') {
      if (sel && col > 0) {
        e.preventDefault();
        const parent = state.path[col];
        state.sel = { col: col - 1, node: parent };
        state.path = state.path.slice(0, col + 1);
        render();
      }
      return;
    }

    if (e.key === 'Enter') {
      if (sel && sel.node.type === 'file') openWithSystem(sel.node);
      return;
    }

    if (e.key === 'Escape') {
      if (sel) { state.sel = null; state.path = [TREE]; render(); }
      return;
    }
  });

  /* 拖拽调整预览宽度 */
  const gutter = $('#gutter');
  let dragging = false;
  gutter.addEventListener('pointerdown', (e) => {
    dragging = true;
    gutter.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
  });
  gutter.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = $('#app-body').getBoundingClientRect();
    const w = rect.right - e.clientX;
    const max = Math.max(320, rect.width - 380);
    $('#preview').style.width = Math.min(Math.max(w, 320), max) + 'px';
  });
  gutter.addEventListener('pointerup', (e) => {
    dragging = false;
    gutter.releasePointerCapture(e.pointerId);
    document.body.classList.remove('resizing');
  });

  /* 启动 */
  document.documentElement.dataset.theme = state.theme;
  render();
})();
</script>
</body>
</html>
