<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>lit explorer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <img class="mark" src="../../assets/icon.svg" alt="" width="26" height="26">
      <span class="brand-text">
        <span class="brand-name" id="root-name">lit explorer</span>
        <span class="brand-sub" id="root-path"></span>
      </span>
    </div>

    <button class="btn-quiet" id="btn-open" title="打开文件夹 (Ctrl+O)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 7.4A2.4 2.4 0 0 1 5.4 5h3.3c.5 0 1 .2 1.4.6l1 1.2h7.5A2.4 2.4 0 0 1 21 9.2v8.4A2.4 2.4 0 0 1 18.6 20H5.4A2.4 2.4 0 0 1 3 17.6z"/>
      </svg>
      <span>打开文件夹</span>
    </button>

    <div class="spacer"></div>

    <label class="search">
      <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>
      </svg>
      <input id="search" type="text" placeholder="搜索文件…  ( / )" autocomplete="off" spellcheck="false">
    </label>

    <button class="iconbtn" id="btn-rescan" title="重新扫描 (F5)" aria-label="重新扫描">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.5 4v4.5H16"/>
      </svg>
    </button>
    <button class="iconbtn" id="btn-preview" title="显示 / 隐藏预览面板 (Ctrl+B)" aria-label="显示或隐藏预览面板">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15"/>
      </svg>
    </button>
    <button class="iconbtn" id="btn-theme" title="切换主题 (Ctrl+Shift+L)" aria-label="切换主题">
      <svg id="theme-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
    <button class="iconbtn" id="btn-menu" title="更多" aria-label="更多">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
      </svg>
    </button>

    <div class="winctl">
      <button class="wc" id="wc-min" title="最小化" aria-label="最小化">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="wc" id="wc-max" title="最大化" aria-label="最大化">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="wc wc-close" id="wc-close" title="关闭" aria-label="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </header>

  <div class="body" id="app-body">
    <div class="main">
      <nav class="crumbs" id="crumbs"></nav>
      <div class="cols" id="cols"></div>
    </div>

    <aside class="preview" id="preview">
      <!-- 预览窗格由 app.js 生成：临时预览列在最左，固定住的列依次排在右侧；
           每个窗格左侧的边界都可以拖动调宽 -->
      <div class="panes" id="panes"></div>
    </aside>
  </div>

  <footer class="status">
    <span class="path" id="st-path"></span>
    <span class="hints">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>→</kbd> 进入</span>
      <span><kbd>←</kbd> 上级</span>
      <span><kbd>⏎</kbd> 打开</span>
      <span>双击 = 默认程序打开</span>
    </span>
  </footer>
</div>

<div class="welcome" id="welcome" hidden>
  <div class="welcome-card">
    <img class="welcome-mark" src="../../assets/icon.svg" alt="" width="56" height="56">
    <h2>打开一个项目目录开始浏览</h2>
    <p>左侧多栏导航，右侧即时预览 HTML / Markdown / 代码 / 图片，双击文件用系统默认程序打开。</p>
    <div class="welcome-actions">
      <button class="btn-primary" id="w-open">打开文件夹…</button>
      <button class="btn-quiet" id="w-sample">打开示例项目</button>
    </div>
    <p class="welcome-hint">也可以把文件夹拖到窗口上</p>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="icons.js"></script>
<script src="highlight.js"></script>
<script src="markdown.js"></script>
<!-- docx / pptx 预览（npm run build 生成，缺失时该类型回落到兜底卡片） -->
<script src="vendor/docpreview.js"></script>
<script src="app.js"></script>
</body>
</html>
